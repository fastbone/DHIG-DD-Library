# Reverse proxy for https://ddlib.dhig.net -> the DD Library container.
#
# Install on the docker host:
#   sudo cp deploy/nginx/ddlib.dhig.net.conf /etc/nginx/sites-available/ddlib.dhig.net
#   sudo ln -s ../sites-available/ddlib.dhig.net /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d ddlib.dhig.net       # fills in the TLS lines below
#   sudo nginx -t && sudo systemctl reload nginx
#
# If this host runs Nginx Proxy Manager instead (port 81 suggests it does),
# don't install this file — create the proxy host in the NPM UI and paste the
# marked block into Advanced. See the end of this file.
#
# Four settings here are not optional for this app:
#   client_max_body_size  — data-room zips are large; nginx defaults to 1 MB
#   proxy_request_buffering off — stream the upload instead of spooling it all
#   proxy_buffering off   — the live indexing/answer streams are SSE
#   proxy_read_timeout    — an analyst turn can think for minutes

upstream ddlib {
    # Must match DD_BIND_ADDR:DD_HOST_PORT in .env.
    server 127.0.0.1:8412;
    keepalive 16;
}

# Two lines below depend on the host, and both fail loudly under `nginx -t`:
#   listen [::]:...  — drop if the host has no IPv6 ("Address family not
#                      supported by protocol")
#   http2 on;        — nginx < 1.25.1 wants it as a listen parameter instead
#                      ("listen 443 ssl http2;")

server {
    listen 80;
    listen [::]:80;
    server_name ddlib.dhig.net;

    # certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ddlib.dhig.net;

    # --- TLS ---------------------------------------------------------------
    # certbot --nginx replaces these three with the real paths.
    ssl_certificate     /etc/letsencrypt/live/ddlib.dhig.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ddlib.dhig.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # The app is only reachable through this proxy, so HSTS is safe here.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # The UI is same-origin only: no iframe embedding, no third-party assets.
    add_header X-Frame-Options "DENY" always;

    # --- request size ------------------------------------------------------
    # Matches DD_MAX_UPLOAD_MB=4096. nginx rejects a larger body with 413
    # before the app ever sees it, so raise both together or neither.
    client_max_body_size 4096m;
    client_body_timeout 300s;

    access_log /var/log/nginx/ddlib.access.log;
    error_log  /var/log/nginx/ddlib.error.log;

    location / {
        proxy_pass http://ddlib;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Required for SSE: the default "Connection: close" would cut the stream.
        proxy_set_header Connection        "";

        # Multi-gigabyte uploads: hand the body straight to the app rather than
        # writing it to /var/lib/nginx first.
        proxy_request_buffering off;
        # Server-sent events (/api/events, streamed answers) and large document
        # downloads must not be held in a buffer waiting to fill. /api/events
        # also sends X-Accel-Buffering: no, which nginx honours on its own — this
        # covers the streamed /api/ask response, which does not.
        proxy_buffering off;
        proxy_cache off;

        # An analyst turn over a large corpus can run for minutes, and the
        # event stream is idle between jobs. 3600s covers both; the app sends an
        # SSE keepalive every 15s, so a truly dead connection is still noticed.
        proxy_connect_timeout 30s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }
}

# ── Nginx Proxy Manager ─────────────────────────────────────────────────────
#
# Proxy host: ddlib.dhig.net -> http -> 127.0.0.1 -> 8412
#   (if NPM runs in a container, 127.0.0.1 is NPM's own container — use the
#   docker host's bridge address, typically 172.17.0.1, or put both containers
#   on one network and use "dd-library" as the hostname with port 8000)
# Tick: Block Common Exploits, Websockets Support, Force SSL, HTTP/2, HSTS.
# SSL tab: request a Let's Encrypt certificate.
# Advanced tab — paste exactly this:
#
#   client_max_body_size 4096m;
#   proxy_request_buffering off;
#   proxy_buffering off;
#   proxy_read_timeout 3600s;
#   proxy_send_timeout 3600s;
#   proxy_set_header Connection "";
#
# Without the first line, uploading a data-room zip fails with 413. Without the
# rest, the indexing progress and streamed answers appear only after they
# finish, and long turns die at 60s.
